name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - name: cli-smoke
        run: |
          ai-house plugins --packs-root ./packs
          ai-house pack-check ./packs/indie-studio-3
      - name: world-kernel-and-turnkey
        working-directory: world-kernel
        run: python -m unittest
        env:
          PYTHONDONTWRITEBYTECODE: "1"
      - name: world-catalog
        working-directory: world-catalog
        run: PYTHONPATH=. python -m unittest discover -s . -p 'test_*.py'
      - name: world-contract-tests
        working-directory: world-contract-tests
        run: PYTHONPATH=../world-catalog python -m unittest discover -s . -p 'test_*.py'
      - name: memory-conformance-tests
        # the private deployment's own memory tests, run against the shared memory module (src/ai_house/common)
        working-directory: memory-conformance-tests
        run: python -m unittest discover -s . -p 'test_*.py'
        env:
          PYTHONDONTWRITEBYTECODE: "1"

  agent-shell:
    # Residents run by the real Claude Code shell, against a local stand-in for the model API (no key, no network).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev,agent]"
      - name: agent-brain
        working-directory: world-kernel
        run: python -m unittest -v test_agent_1_runtime test_agent_2_house test_agent_3_real_shell
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          AI_HOUSE_REQUIRE_REAL_SHELL: "1"

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
