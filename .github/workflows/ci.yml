name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt
      - name: world-kernel
        working-directory: world-kernel
        run: python -m unittest
        env:
          PYTHONDONTWRITEBYTECODE: "1"
      - name: world-catalog
        working-directory: world-catalog
        run: PYTHONPATH=. python -m unittest discover -s . -p 'test_*.py'
      - name: world-contract-tests
        working-directory: world-contract-tests
        run: PYTHONPATH=../world-catalog python -m unittest discover -s . -p 'test_*.py'

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
