# 小屋和 OneBot v11 协议端（SnowLuma，或 NapCat / Lagrange 等）都跑在 Docker 里时用：
# 让两个容器进同一个 Docker 网络，小屋用服务名直接连协议端的正向 WebSocket，端口不必发布到宿主机。
#
# 这个文件不会启动协议端。协议端请按它自己的官方文档部署；本项目不打包、不分发任何协议端。
#
# 1) 建一个共用网络（只需一次）：
#        docker network create onebot
# 2) 让协议端的容器加入这个网络（在它自己的 compose 里加）：
#        services:
#          <协议端的服务名>:
#            networks: [default, onebot]
#        networks:
#          onebot:
#            external: true
# 3) 在小屋的 .env 里写（主机名 = 协议端的服务名或容器名，端口 = 它的正向 WebSocket 端口）：
#        ONEBOT_WS_URL=ws://snowluma:3001
#        ONEBOT_ACCESS_TOKEN=<协议端里为这个 WebSocket 服务设的令牌>
#        ONEBOT_OWNER_QQ=<你本人的 QQ 号>
# 4) 启动并检查：
#        docker compose -f compose.yaml -f deploy/onebot/compose.onebot.yaml up -d
#        docker compose -f compose.yaml -f deploy/onebot/compose.onebot.yaml exec ai-house ai-house doctor --onebot-ping
#
# 完整说明见 docs/DEPLOY.md。
services:
  ai-house:
    networks: [frontend, citynet, onebot]

networks:
  onebot:
    external: true
    name: ${ONEBOT_NETWORK:-onebot}
